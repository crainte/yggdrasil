platforms:
  kubernetes: ["1.36"]
repositories:
  lighthouse-dev:
    path: ../uptime/oni-packages
packages:
  metrics-server:
    version: "=0.9.0"
    namespace: kube-system
  cert-manager:
    version: "=1.21.2"
    namespace: cert-manager
    createNamespace: true
  external-secrets:
    version: "=2.12.0"
    namespace: external-secrets
    createNamespace: true
  bitwarden-sdk-server:
    version: "=0.8.1"
    namespace: external-secrets
  bitwarden-secret-store:
    version: "=1.0.0"
    namespace: external-secrets
    config: bitwarden-secret-store.yaml
  letsencrypt-cloudflare:
    version: "=1.0.0"
    namespace: cert-manager
    config: letsencrypt-cloudflare.yaml
  bifrost:
    version: "=0.1.2"
    namespace: dns
    config: bifrost.yaml
  postgresql-credentials:
    version: "=1.0.0"
    namespace: infra
    config: postgresql-credentials.yaml
  postgresql:
    version: "=16.15.0"
    namespace: infra
    config: postgresql.yaml
  knot-resolver:
    version: "=6.5.1"
    namespace: dns
    createNamespace: true
    config: knot-resolver.yaml
  alloy:
    version: "=1.13.1"
    namespace: monitoring
    createNamespace: true
    config: alloy.yaml
  chrony:
    version: "=0.9.1"
    namespace: ntp
    createNamespace: true
    config: chrony.yaml
  ntfy:
    version: "=2.15.0"
    namespace: ntfy
    createNamespace: true
    config: ntfy.yaml
  lighthouse:
    package: lighthouse-dev/lighthouse
    version: "=0.1.0"
    namespace: lighthouse
    createNamespace: true
    config: lighthouse.yaml
