platforms:
  kubernetes: ["1.36"]
packages:
  cert-manager:
    version: "=1.21.2"
    namespace: cert-manager
    createNamespace: true
  external-secrets:
    version: "=2.12.0"
    namespace: external-secrets
    createNamespace: true
  bitwarden-sdk-server:
    version: "=0.8.1"
    namespace: external-secrets
  bitwarden-secret-store:
    version: "=1.0.0"
    namespace: external-secrets
    config: bitwarden-secret-store.yaml
  bifrost:
    version: "=0.1.2"
    namespace: dns
    config: bifrost.yaml
  postgresql-credentials:
    version: "=1.0.0"
    namespace: infra
    config: postgresql-credentials.yaml
  postgresql:
    version: "=16.15.0"
    namespace: infra
    config: postgresql.yaml
  knot-resolver:
    version: "=6.5.1"
    namespace: dns
    createNamespace: true
    config: knot-resolver.yaml
  alloy:
    version: "=1.13.1"
    namespace: monitoring
    createNamespace: true
    config: alloy.yaml
