apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost-credentials
  namespace: dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: bifrost-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BIFROST_ADMIN_PASSWORD_HASH
      remoteRef:
        key: BIFROST_ADMIN_PASSWORD_HASH
    - secretKey: BIFROST_ADMIN_USER
      remoteRef:
        key: BIFROST_ADMIN_USER
    - secretKey: BIFROST_COOKIE
      remoteRef:
        key: BIFROST_COOKIE
    - secretKey: BIFROST_DB_PASSWORD
      remoteRef:
        key: BIFROST_DB_PASSWORD
    - secretKey: BIFROST_SESSION_SECRET
      remoteRef:
        key: BIFROST_SESSION_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: postgresql-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: POSTGRES_PASSWORD
