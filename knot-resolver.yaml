replicas: 2
minAvailable: 1
config: |
  workers: 2
  logging:
    groups: [manager, cache]
    level: info
  dnssec:
    log-bogus: true
  network:
    do-ipv6: false
    listen:
      - interface: eth0@8053
  rate-limiting:
    rate-limit: 768
    dry-run: true
  cache:
    prefetch:
      expiring: true
deployments:
  knot:
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      $ref: pod-disruption-budgets/knot.spec.selector
                    topologyKey: kubernetes.io/hostname
