replicas: 2
minAvailable: 1
config: |
  workers: 2
  logging:
    groups: [manager, cache]
    level: info
  dnssec:
    log-bogus: true
  network:
    do-ipv6: false
    listen:
      - interface: eth0@8053
  rate-limiting:
    rate-limit: 768
    dry-run: true
  cache:
    prefetch:
      expiring: true
deployments:
  knot:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: knot
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: runtime
                  mountPath: /run/knot-resolver
                - name: cache
                  mountPath: /var/cache/knot-resolver
          volumes:
            - name: runtime
              emptyDir: {}
            - name: cache
              emptyDir: {}
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      $ref: pod-disruption-budgets/knot.spec.selector
                    topologyKey: kubernetes.io/hostname
